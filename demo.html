  <body>
    <div class="aspect-video rounded-4xl">
      <div class="video-wrapper">
        <iframe
          id="yt-video"
          src="https://www.youtube.com/embed/n7yTAqA7i3Q?enablejsapi=1"
          frameborder="0"
          allow="autoplay; encrypted-media"
          allowfullscreen
        >
        </iframe>

        <img
          id="video-poster"
          src="https://media.cmsmax.cloud/S9wVn8afwQCh4flyzuKI801M/marquee-sign_1.jpg"
          onclick="playVideo()"
        />
      </div>

      <style>
        .video-wrapper {
          position: relative;
          width: 100%;
          height: 400px;
        }

        .video-wrapper iframe {
          width: 100%;
          height: 100%;
        }

        #video-poster {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          cursor: pointer;
        }
      </style>

      <script>
        function playVideo() {
          const iframe = document.getElementById("yt-video");
          const poster = document.getElementById("video-poster");

          iframe.src += "&autoplay=1";
          poster.style.display = "none";
        }
      </script>
    </div>
